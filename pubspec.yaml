name: nizar_ztn_portfolio
description: "A new Flutter project."

publish_to: "none"

version: 2.0.3+23

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  go_router:
  url_launcher:
  firebase_core:
  firebase_analytics_web:
  firebase_analytics:

  google_fonts:
  gap:
  carousel_slider:
  flutter_svg:
  responsive_grid_list:
  universal_html:
  typeset:
  flutter_markdown:
  intl:
  webview_flutter_web:
  webview_flutter:
  flutter_html:
  font_awesome_flutter:

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/mob/food_app/
    - assets/images/mob/ig/
    - assets/images/mob/live_stream_simulator/
    - assets/images/mob/jdm/
    - assets/images/mob/nx_shop/
    - assets/images/mob/peak_store/
    - assets/images/mob/quick_qr_pro/
    - assets/images/mob/sa3arli/
    - assets/images/mob/tiktok/
    - assets/images/mob/tune_hub/
    - assets/images/mob/audio_libro/
    - assets/images/mob/stretchyv1/
    - assets/images/mob/stretchyv2/
    - assets/images/mob/dupli/
    - assets/images/mob/social_profile_prank/
    - assets/images/mob/workout_finder/
    # - assets/images//
    - assets/icons/
    - assets/fonts/
    - assets/svgs/
    - assets/images/game_design/poly_town/
    - assets/images/game_design/blaster_pranks/
    - assets/images/game_design/medieval_pack/
    - assets/images/game_design/double_jump/

    - assets/mark_down/

  fonts:
    - family: Agustina
      fonts:
        - asset: assets/fonts/agustina/agustina.otf

    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/montserrat.ttf

    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Light.ttf
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 900
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
          style: italic
